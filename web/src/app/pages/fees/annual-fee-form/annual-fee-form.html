@if (visible) {
  <div class="modal-overlay" (click)="onClose()">
    <div class="modal-content" (click)="$event.stopPropagation()">

      <div class="modal-header">
        <h2>{{ isEditing ? 'Edit Annual Fee' : 'New Annual Fee' }}</h2>
        <button type="button" class="close-button" (click)="onClose()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="modal-body">

        @if (errorMessage) {
          <div class="error-banner">{{ errorMessage }}</div>
        }

        <div class="form-row">
          <div class="form-group full-width">
            <label>Applies to Classes</label>
            <div class="checkbox-group">
              @for (c of classes; track c.id) {
                <label class="checkbox-item">
                  <input type="checkbox"
                         [checked]="isClassSelected(c.id)"
                         (change)="toggleClass(c.id)"
                         [disabled]="isEditing"/>
                  <span>{{ c.name }}</span>
                </label>
              }
            </div>
            @if (!isEditing) {
              <div class="checkbox-actions">
                <button type="button" class="link-button" (click)="selectAllClasses()">Select all</button>
                <button type="button" class="link-button" (click)="clearClasses()">Clear</button>
              </div>
            }
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Academic Year</label>
            <select [(ngModel)]="selectedAcademicYearId"
                    [disabled]="isEditing"
                    [ngModelOptions]="{ standalone: true }">
              @for (y of academicYears; track y.id) {
                <option [ngValue]="y.id">{{ y.name }}</option>
              }
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Fee Name</label>
            <input type="text" [(ngModel)]="name"
                   placeholder="e.g. Registration"
                   [ngModelOptions]="{ standalone: true }"/>
          </div>

          <div class="form-group">
            <label>Amount (M)</label>
            <input type="number" [(ngModel)]="amount"
                   step="0.01" min="0"
                   placeholder="0.00"
                   [ngModelOptions]="{ standalone: true }"/>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Description (optional)</label>
            <textarea [(ngModel)]="description"
                      rows="3"
                      placeholder="Add any notes about this fee..."
                      [ngModelOptions]="{ standalone: true }"></textarea>
          </div>
        </div>

        <div class="info-note">
          <i class="fa-solid fa-circle-info"></i>
          This fee is charged once per academic year, not per term.
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="secondary-button" (click)="onClose()" [disabled]="saving">
          Cancel
        </button>
        <button type="button" class="primary-button" (click)="onSave()" [disabled]="saving">
          {{ saving ? 'Saving...' : (isEditing ? 'Save Changes' : 'Create') }}
        </button>
      </div>

    </div>
  </div>
}
