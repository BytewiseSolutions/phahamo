@if (visible) {
  <div class="modal-overlay" (click)="onOverlayClick($event)">
    <div class="modal-content">
      <div class="modal-header">
        <h2>{{ isEditMode ? 'Edit User' : 'Add User' }}</h2>
        <button type="button" class="close-button" (click)="onClose()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="create-user-form">

        <div class="form-group">
          <label for="fullName">Full Name</label>
          <div class="input-icon">
            <i class="fa-solid fa-user"></i>
            <input id="fullName" type="text" formControlName="fullName" placeholder="Lebohang Monamane"/>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-icon">
              <i class="fa-solid fa-envelope"></i>
              <input id="email" type="email" formControlName="email"/>
            </div>
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <div class="input-icon">
              <i class="fa-solid fa-phone"></i>
              <input id="phone" type="text" formControlName="phone"/>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <div class="input-icon">
            <i class="fa-solid fa-graduation-cap"></i>
            <select id="role" formControlName="role">
              <option value="" disabled>Select a role</option>
              @for (role of availableRoles; track role) {
                <option [value]="role">{{ role }}</option>
              }
            </select>
          </div>
        </div>

        @if (!isEditMode && selectedRole === 'STUDENT') {
          <div class="form-row">
            <div class="form-group">
              <label for="studentDateOfBirth">Date of Birth</label>
              <input id="studentDateOfBirth" type="date" formControlName="studentDateOfBirth"/>
            </div>
            <div class="form-group">
              <label for="studentGender">Gender</label>
              <select id="studentGender" formControlName="studentGender">
                <option value="" disabled>Select gender</option>
                @for (g of availableGenders; track g) {
                  <option [value]="g">{{ g }}</option>
                }
              </select>
            </div>
          </div>
        }

        @if (!isEditMode && selectedRole === 'PARENT') {
          <div class="form-group">
            <label for="parentRelationship">Relationship</label>
            <select id="parentRelationship" formControlName="parentRelationship">
              <option value="" disabled>Select relationship</option>
              @for (r of availableRelationships; track r) {
                <option [value]="r">{{ r }}</option>
              }
            </select>
          </div>
        }

        @if (!isEditMode && selectedRole === 'TEACHER') {
          <div class="form-row">
            <div class="form-group">
              <label for="teacherQualifications">Qualifications</label>
              <input id="teacherQualifications" type="text" formControlName="teacherQualifications"/>
            </div>
            <div class="form-group">
              <label for="teacherSpecialization">Specialization</label>
              <input id="teacherSpecialization" type="text" formControlName="teacherSpecialization"/>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="teacherDateJoined">Date Joined</label>
              <input id="teacherDateJoined" type="date" formControlName="teacherDateJoined"/>
            </div>
            <div class="form-group">
              <label for="teacherEmploymentType">Employment Type</label>
              <select id="teacherEmploymentType" formControlName="teacherEmploymentType">
                <option value="" disabled>Select type</option>
                @for (t of availableEmploymentTypes; track t) {
                  <option [value]="t">{{ t }}</option>
                }
              </select>
            </div>
          </div>
        }

        @if (isEditMode) {
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" formControlName="status">
              @for (status of availableStatuses; track status) {
                <option [value]="status">{{ status }}</option>
              }
            </select>
          </div>
        }

        <div class="modal-actions">
          <button type="button" class="secondary-button" (click)="onClose()">Cancel</button>
          <button type="submit" class="primary-button">{{ isEditMode ? 'Save Changes' : 'Create User' }}</button>
        </div>
      </form>
    </div>
  </div>
}
