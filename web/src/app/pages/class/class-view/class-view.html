<div class="class-view-page">

  <div class="page-header">
    @if (schoolClass) {
      <h1>{{ schoolClass.name }}</h1>
    }

    <button type="button" class="link-button" (click)="onBack()">
      &larr; Back to classes
    </button>
  </div>

  @if (schoolClass) {
    <div class="class-details">
      <div class="detail-row">
        <span class="label">Class Level:</span>
        <span>{{ schoolClass.gradeLevel }}</span>
      </div>

      <div class="detail-row">
        <span class="label">Academic Year:</span>
        <span>{{ schoolClass.academicYearName }}</span>
      </div>

      <div class="detail-row">
        <span class="label">Teacher:</span>
        <span>{{ schoolClass.classTeacherName || '—' }}</span>
      </div>
    </div>

    <div class="class-tabs">
      <button
        type="button"
        class="class-tab"
        [class.active]="activeTab === 'subjects'"
        (click)="activeTab = 'subjects'">
        Subjects
      </button>

      <button
        type="button"
        class="class-tab"
        [class.active]="activeTab === 'students'"
        (click)="activeTab = 'students'">
        Students
      </button>
    </div>

    @if (activeTab === 'subjects') {
      <app-subject-class-assignment-list
        [schoolClassId]="schoolClass.id">
      </app-subject-class-assignment-list>
    } @else {
      <app-class-student-list
        [schoolClassId]="schoolClass.id">
      </app-class-student-list>
    }
  }

</div>
