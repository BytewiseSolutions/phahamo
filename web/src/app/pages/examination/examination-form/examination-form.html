@if (visible) {
  <div class="modal-overlay" (click)="onOverlayClick($event)">
    <div class="modal-content" (click)="$event.stopPropagation()">

      <div class="modal-header">
        <h2>{{ isEditMode ? 'Edit Examination' : 'New Examination' }}</h2>
        <button type="button" class="close-button" (click)="onClose()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="modal-body">

        @if (errorMessage) {
          <div class="error-banner">{{ errorMessage }}</div>
        }

        @if (loading) {
          <p class="hint">Loading...</p>
        } @else {

          <div class="form-group">
            <label>Term</label>
            <select [(ngModel)]="selectedTermId" [ngModelOptions]="{ standalone: true }">
              <option [ngValue]="null" disabled>Select term</option>
              @for (t of terms; track t.id) {
                <option [ngValue]="t.id">{{ t.name }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label>Name</label>
            <input type="text" placeholder="e.g. Mid-Term Exams" [(ngModel)]="name" [ngModelOptions]="{ standalone: true }"/>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Start Date</label>
              <input type="date" [(ngModel)]="startDate" [ngModelOptions]="{ standalone: true }"/>
            </div>
            <div class="form-group">
              <label>End Date</label>
              <input type="date" [(ngModel)]="endDate" [ngModelOptions]="{ standalone: true }"/>
            </div>
          </div>

          <div class="form-group">
            <label>Subjects & Classes</label>
            <div class="checkbox-list">
              @for (a of subjectClassOptions; track a.id) {
                <label class="checkbox-item">
                  <input type="checkbox"
                         [checked]="isSelected(a)"
                         (change)="toggle(a)"/>
                  <span>{{ formatAssignment(a) }}</span>
                </label>
              }
            </div>
          </div>

        }

      </div>

      <div class="modal-actions">
        <button type="button" class="secondary-button" (click)="onClose()">Cancel</button>
        <button type="button" class="primary-button" [disabled]="loading" (click)="onSubmit()">
          {{ isEditMode ? 'Save Changes' : 'Create' }}
        </button>
      </div>

    </div>
  </div>
}
