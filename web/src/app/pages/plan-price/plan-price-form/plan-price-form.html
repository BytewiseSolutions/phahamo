@if (visible) {
  <div class="modal-overlay" (click)="onOverlayClick($event)">
    <div class="modal-content" (click)="$event.stopPropagation()">

      <div class="modal-header">
        <h2>{{ isEditMode ? 'Edit Price' : 'Add Price' }}</h2>
        <button type="button" class="close-button" (click)="onClose()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="modal-body">

        @if (isEditMode) {
          <p class="hint">
            {{ formatEnum(editingPrice!.plan) }} — {{ editingPrice!.currency }}
          </p>
        } @else {
          <div class="form-group">
            <label>Plan</label>
            <select [(ngModel)]="formPlan" [ngModelOptions]="{ standalone: true }">
              @for (p of plans; track p) {
                <option [ngValue]="p">{{ formatEnum(p) }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label>Currency</label>
            <select [(ngModel)]="formCurrency" [ngModelOptions]="{ standalone: true }">
              @for (c of currencies; track c) {
                <option [ngValue]="c">{{ c }}</option>
              }
            </select>
          </div>
        }

        <div class="form-group">
          <label>Amount</label>
          <input type="number" min="0" step="0.01" [(ngModel)]="formAmount" [ngModelOptions]="{ standalone: true }"/>
        </div>

        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" [(ngModel)]="formActive" [ngModelOptions]="{ standalone: true }"/>
            <span>Active</span>
          </label>
        </div>

      </div>

      <div class="modal-actions">
        <button type="button" class="secondary-button" (click)="onClose()">Cancel</button>
        <button type="button" class="primary-button" (click)="onSubmit()">
          {{ isEditMode ? 'Save Changes' : 'Add Price' }}
        </button>
      </div>

    </div>
  </div>
}
