@if (result) {
  <div class="modal-overlay" (click)="onOverlayClick($event)">
    <div class="modal-content" (click)="$event.stopPropagation()">

      <div class="modal-header">
        <h2>Override Final Mark</h2>
        <button type="button" class="close-button" (click)="onClose()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="modal-body">

        @if (errorMessage) {
          <div class="error-banner">{{ errorMessage }}</div>
        }

        <div class="summary">
          <div><strong>Student:</strong> {{ result.studentLastName }} {{ result.studentFirstName }}</div>
          <div><strong>Subject:</strong> {{ result.subjectName }}</div>
          <div><strong>Term:</strong> {{ result.termName }}</div>
          <div><strong>Current Mark:</strong> {{ result.finalMark }} ({{ result.grade || '—' }})</div>
        </div>

        <div class="form-group">
          <label>New Mark (0–100)</label>
          <input type="number" min="0" max="100" step="0.01"
                 [(ngModel)]="newMark" [ngModelOptions]="{ standalone: true }"/>
        </div>

        <div class="form-group">
          <label>Reason</label>
          <textarea rows="3"
                    [(ngModel)]="reason"
                    [ngModelOptions]="{ standalone: true }"
                    placeholder="Why is this final mark being overridden?"></textarea>
        </div>

      </div>

      <div class="modal-actions">
        <button type="button" class="secondary-button" (click)="onClose()">Cancel</button>
        <button type="button" class="primary-button" [disabled]="saving" (click)="onSubmit()">
          {{ saving ? 'Saving...' : 'Override' }}
        </button>
      </div>

    </div>
  </div>
}
