<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"/><style>
@page { size: A4 landscape; margin: 12mm; } body { font-family: Arial; color: #172033; font-size: 9pt; }
.header { border-bottom: 2px solid #1d4ed8; padding-bottom: 10px; margin-bottom: 14px; }.logo { width: 48px; height: 48px; object-fit: contain; vertical-align: middle; margin-right: 10px; } h1 { display: inline-block; vertical-align: middle; font-size: 18pt; margin: 0; }.term { color: #64748b; margin-top: 5px; } table { width: 100%; border-collapse: collapse; } th, td { border: 1px solid #cbd5e1; padding: 6px; text-align: left; } th { background: #eff6ff; }
</style></head><body><div class="header"><img th:if="${logoDataUri}" class="logo" th:src="${logoDataUri}"/><h1 th:text="${schoolName}"></h1><div th:if="${className}"><strong>Class timetable — </strong><span th:text="${className}"></span></div><div th:if="${teacherName}"><strong>Teacher timetable — </strong><span th:text="${teacherName}"></span></div><div class="term" th:text="${termName}"></div></div><table><thead><tr><th>Day</th><th>Period</th><th>Time</th><th>Subject</th><th>Class</th><th>Teacher</th></tr></thead><tbody><tr th:each="slot : ${slots}"><td th:text="${slot.dayOfWeek}"></td><td th:text="${slot.period.name}"></td><td><span th:text="${slot.period.startTime}"></span> — <span th:text="${slot.period.endTime}"></span></td><td th:text="${slot.assignment.subject.name}"></td><td th:text="${slot.assignment.schoolClass.name}"></td><td th:text="${slot.assignment.teacher != null ? slot.assignment.teacher.fullName : '—'}"></td></tr></tbody></table></body></html>
