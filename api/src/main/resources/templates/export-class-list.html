<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"/><style>
@page { size: A4; margin: 18mm; } body { font-family: Arial; color: #172033; font-size: 11pt; }
.header { border-bottom: 2px solid #1d4ed8; padding-bottom: 12px; margin-bottom: 20px; }.logo { width: 55px; height: 55px; object-fit: contain; vertical-align: middle; margin-right: 12px; } h1 { display: inline-block; vertical-align: middle; font-size: 20pt; margin: 0; }.term { color: #64748b; margin-top: 8px; } table { width: 100%; border-collapse: collapse; } th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; } th { background: #eff6ff; }
</style></head><body><div class="header"><img th:if="${logoDataUri}" class="logo" th:src="${logoDataUri}"/><h1 th:text="${schoolName}"></h1><div><strong>Class list — </strong><span th:text="${className}"></span></div><div class="term" th:text="${termName}"></div></div><table><thead><tr><th>#</th><th>Name</th><th>Admission number</th></tr></thead><tbody><tr th:each="student,stat : ${students}"><td th:text="${stat.count}"></td><td th:text="${student.user.fullName}"></td><td th:text="${student.admissionNumber}"></td></tr></tbody></table></body></html>
